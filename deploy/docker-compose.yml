services:
  # 1. PostgreSQL 18 with btree_gist extension
  db:
    image: postgres:18-bookworm
    container_name: campus_postgres
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Valkey In-Memory Cache
  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: campus_valkey
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. FastAPI Web Application Server
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: campus_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@db:5432/postgres
      VALKEY_URL: valkey://valkey:6379/0
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python seed_data.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  # 4. Background Worker Process (OS Process Separation)
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: campus_worker
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@db:5432/postgres
      VALKEY_URL: valkey://valkey:6379/0
    depends_on:
      db:
        condition: service_healthy
    command: python -m worker.worker

  # 5. Reverse Proxy & Frontend Web Server (Caddy)
  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: campus_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - backend

volumes:
  pgdata:
